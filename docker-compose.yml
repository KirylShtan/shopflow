services:
  catalog-db:
    image: postgres:17
    container_name: shopflow-catalog-db
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready - U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 5