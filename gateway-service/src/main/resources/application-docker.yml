spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: http://catalog-service:8085
              predicates:
                - Path=/api/products/**
            - id: inventory-service
              uri: http://inventory-service:8086
              predicates:
                - Path=/api/stock/**
            - id: order-service
              uri: http://order-service:8087
              predicates:
                - Path=/api/orders/**