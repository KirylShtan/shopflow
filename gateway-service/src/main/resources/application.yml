server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/products/**
            - id: inventory-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/stock/**
            - id: order-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/orders/**